services:
  neo4j:
    image: neo4j:5-community
    container_name: agentmesh-runtime-neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: ${AGENTMESH_RUNTIME_NEO4J_USER:-neo4j}/${AGENTMESH_RUNTIME_NEO4J_PASSWORD:-password}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
